name: Build deb

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  package:
    name: Build nemo deb
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: linuxmintd/mint22.3-amd64
      options: --security-opt seccomp=unconfined
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update environment
        run: |
          echo 'debconf debconf/frontend select Noninteractive' | debconf-set-selections
          apt-get update
          apt-get -y dist-upgrade

      - name: Install build dependencies
        run: |
          apt-get install -y --no-install-recommends \
            build-essential \
            meson \
            ninja-build \
            pkg-config \
            dpkg-dev \
            fakeroot \
            gettext \
            intltool \
            itstool \
            gobject-introspection \
            libatk1.0-dev \
            libcinnamon-desktop-dev \
            libexempi-dev \
            libexif-dev \
            libgail-3-dev \
            libgirepository1.0-dev \
            libglib2.0-dev \
            libgsf-1-dev \
            libgtk-3-dev \
            libgtk-layer-shell-dev \
            libjson-glib-dev \
            libpango1.0-dev \
            libwayland-dev \
            libx11-dev \
            libxapp-dev \
            libxext-dev \
            libxrender-dev \
            libxml2-dev \
            python3 \
            python3-gi

      - name: Read version from meson.build
        id: version
        run: |
          VER=$(sed -n "s/.*version : '\([0-9][0-9.]*\)'.*/\1/p" meson.build | head -1)
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Configure
        run: |
          meson setup build \
            --prefix=/usr \
            --libdir=lib/x86_64-linux-gnu \
            --buildtype=debugoptimized \
            -D deprecated_warnings=false \
            -D gtk_doc=false \
            -D gtk_layer_shell=true \
            -D selinux=false

      - name: Build
        run: ninja -C build

      - name: Install to staging directory
        run: DESTDIR=/tmp/staging meson install -C build

      - name: Compute shared library dependencies
        id: shlibs
        shell: bash
        run: |
          mkdir -p /tmp/pkgbuild/debian
          cat > /tmp/pkgbuild/debian/control <<'EOF'
          Source: nemo
          Section: misc
          Priority: optional
          Maintainer: Ulas <ulasalkan@gmail.com>

          Package: nemo
          Architecture: any
          Depends: ${shlibs:Depends}
          Description: nemo
          EOF
          cat > /tmp/pkgbuild/debian/shlibs.local <<'EOF'
          libnemo-extension 1 libnemo-extension1 (>= 5.0.3)
          EOF
          cd /tmp/pkgbuild
          set -o pipefail
          LIBNEMO=$(ls /tmp/staging/usr/lib/x86_64-linux-gnu/libnemo-extension.so.*.*.* | head -1)
          DEPS=$(dpkg-shlibdeps -O \
            -l/tmp/staging/usr/lib/x86_64-linux-gnu \
            -l/tmp/staging/usr/lib \
            /tmp/staging/usr/bin/nemo \
            /tmp/staging/usr/bin/nemo-desktop \
            /tmp/staging/usr/bin/nemo-connect-server \
            /tmp/staging/usr/bin/nemo-open-with \
            /tmp/staging/usr/bin/nemo-autorun-software \
            /tmp/staging/usr/libexec/nemo-extensions-list \
            "$LIBNEMO" 2>/dev/null \
            | sed 's/^shlibs:Depends=//')
          DEPS=$(echo "$DEPS" | sed 's/libnemo-extension1 ([^)]*), *//g; s/libnemo-extension1 ([^)]*)//')
          echo "deps=$DEPS" >> "$GITHUB_OUTPUT"

      - name: Generate package control file
        run: |
          mkdir -p /tmp/staging/DEBIAN
          cat > /tmp/staging/DEBIAN/control <<EOF
          Package: nemo
          Version: ${{ steps.version.outputs.version }}
          Section: misc
          Priority: optional
          Architecture: amd64
          Maintainer: Ulas <ulasalkan@gmail.com>
          Installed-Size: $(du -sk /tmp/staging/usr | cut -f1)
          Depends: ${{ steps.shlibs.outputs.deps }}, cinnamon-desktop-data (>= 4.8.0), cinnamon-l10n, desktop-file-utils (>= 0.7), gsettings-desktop-schemas, gvfs (>= 1.3.2), libglib2.0-data, shared-mime-info (>= 0.50), poppler-utils, exif, id3, catdoc, untex, html2text, python3, python3-xlrd, xapp-symbolic-icons (>= 1.0.7)
          Replaces: nemo-data, libnemo-extension1, gir1.2-nemo-3.0, libnemo-extension-dev
          Provides: nemo-data, libnemo-extension1, gir1.2-nemo-3.0, libnemo-extension-dev
          Conflicts: nemo-desktop
          Homepage: https://github.com/simpletools-nl/mint-nemo
          Description: file manager and graphical shell for Cinnamon
           Nemo is the official file manager for the Cinnamon desktop. It allows
           to browse directories, preview files and launch applications associated
           with them. It is also responsible for handling the icons on the Cinnamon
           desktop. It works on local and remote filesystems.
           .
           This package is built from the custom branch that adds the macOS
           Finder-style Column View (Miller columns) to Nemo.
          EOF
          cat > /tmp/staging/DEBIAN/postinst <<'EOF'
          #!/bin/sh
          set -e

          if [ "$1" = "configure" ]; then
              if [ -x /usr/sbin/glib-compile-schemas ]; then
                  glib-compile-schemas /usr/share/glib-2.0/schemas
              fi
              if [ -x /usr/bin/update-desktop-database ]; then
                  update-desktop-database -q 2>/dev/null || true
              fi
              if [ -x /usr/bin/update-mime-database ]; then
                  update-mime-database /usr/share/mime >/dev/null 2>&1 || true
              fi
              if [ -x /usr/bin/gtk-update-icon-cache ]; then
                  gtk-update-icon-cache -q -f /usr/share/icons/hicolor 2>/dev/null || true
              fi
              if [ -x /sbin/ldconfig ]; then
                  /sbin/ldconfig
              fi
          fi

          exit 0
          EOF
          chmod 755 /tmp/staging/DEBIAN/postinst

      - name: Build deb package
        run: |
          dpkg-deb --build --root-owner-group /tmp/staging /tmp/nemo_${{ steps.version.outputs.version }}_amd64.deb
          ls -la /tmp/nemo_${{ steps.version.outputs.version }}_amd64.deb

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: nemo-deb
          path: /tmp/nemo_${{ steps.version.outputs.version }}_amd64.deb
          if-no-files-found: error

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: ncipollo/release-action@v1
        with:
          artifacts: /tmp/nemo_${{ steps.version.outputs.version }}_amd64.deb
          token: ${{ secrets.GITHUB_TOKEN }}
